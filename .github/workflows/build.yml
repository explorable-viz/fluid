name: build

on:
  push:
    branches: [develop, staging, release, 'fluid-*']
    paths-ignore:
    - 'old/**'
    - '**.md'
  pull_request:
    paths-ignore:
    - 'old/**'
    - '**.md'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/test.yml

  spec-compliance:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: cache PureScript dependencies
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-spago-${{ hashFiles('**/*.dhall') }}
        path: fluid/.spago
    - name: hash source file list
      id: sources
      run: echo "hash=$(git ls-files fluid/src fluid/test fluid/config | sort | shasum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: cache compiler output
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-output-${{ hashFiles('**/*.dhall') }}-${{ steps.sources.outputs.hash }}
        path: fluid/output
    - uses: astral-sh/setup-uv@v10.2.0
    - name: spec-compliance
      run: |
        yarn install
        yarn workspace @fluid-org/fluid build-prod
        yarn workspace @fluid-org/fluid spec-compliance

  deploy-fluid-org:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/staging'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: build
      run: |
        yarn install
        yarn workspace @fluid-org/fluid build
        yarn workspace fluid-org build
    - name: gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: website/fluid-org/build
        keep_files: false
    - name: test deployed website
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./fluid/script/util/test-deployed-website.sh https://f.luid.org website/fluid-org
