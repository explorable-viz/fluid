name: deploy

on:
  push:
    paths-ignore:
    - 'old/**'
    - '**.md'
  pull_request:
    paths-ignore:
    - 'old/**'
    - '**.md'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy-fluid-org:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/staging'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: build
      run: |
        yarn install
        yarn workspace @explorable-viz/fluid build
        yarn workspace fluid-org build
    - name: gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: website/fluid-org/build
        keep_files: false
    - name: wait for GitHub Pages deployment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        LATEST='gh run list --workflow=pages-build-deployment --branch=gh-pages --limit=1'

        ./script/util/poll.sh "Waiting for Pages deployment to start..." 30 \
          "[[ \"\$($LATEST --json createdAt --jq '.[0].createdAt')\" > \"$DEPLOY_TIME\" ]]"

        ./script/util/poll.sh "Waiting for Pages deployment to complete..." 60 \
          "[ \"\$($LATEST --json status --jq '.[0].status')\" = \"completed\" ]"

        CONCLUSION=$($LATEST --json conclusion --jq '.[0].conclusion')
        echo "Pages deployment: $CONCLUSION"
        [ "$CONCLUSION" = "success" ] || { echo "Pages deployment failed!" >&2; exit 1; }
    - name: test deployed website
      run: |
        ./script/util/install-puppeteer.sh
        cd website/fluid-org
        ../../script/util/run-website-tests.sh https://f.luid.org
