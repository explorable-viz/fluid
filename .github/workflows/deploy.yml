name: deploy

on:
  push:
    paths-ignore:
    - 'old/**'
    - '**.md'
  pull_request:
    paths-ignore:
    - 'old/**'
    - '**.md'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy-fluid-org:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/staging'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: build
      run: |
        yarn install
        yarn workspace @explorable-viz/fluid build
        yarn workspace fluid-org build
    - name: gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: website/fluid-org/build
        keep_files: false
    - name: wait for GitHub Pages deployment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "Waiting for pages-build-deployment (created after $DEPLOY_TIME)..."
        sleep 15
        for i in $(seq 1 60); do
          RUN=$(gh run list --workflow=pages-build-deployment --branch=gh-pages --limit=1 --json status,conclusion,createdAt --jq '.[0]')
          CREATED=$(echo "$RUN" | jq -r '.createdAt')
          STATUS=$(echo "$RUN" | jq -r '.status')
          if [[ "$CREATED" > "$DEPLOY_TIME" || "$CREATED" == "$DEPLOY_TIME" ]]; then
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
              echo "Pages deployment completed: $CONCLUSION"
              if [ "$CONCLUSION" != "success" ]; then
                echo "Pages deployment failed!" >&2
                exit 1
              fi
              break
            fi
            echo "Attempt $i: status=$STATUS (run created $CREATED)"
          else
            echo "Attempt $i: waiting for new run (latest is from $CREATED)"
          fi
          sleep 10
        done
    - name: test deployed website
      run: |
        ./script/util/install-puppeteer.sh
        cd website/fluid-org
        ../../script/util/run-website-tests.sh https://f.luid.org
