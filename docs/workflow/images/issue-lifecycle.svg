<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-light" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Background regions -->
  <rect x="20" y="50" width="250" height="310" rx="12" fill="#f0f4ff" stroke="#b0c4de" stroke-width="1.5"/>
  <rect x="290" y="50" width="280" height="310" rx="12" fill="#fff8f0" stroke="#deb887" stroke-width="1.5"/>
  <rect x="590" y="50" width="210" height="310" rx="12" fill="#f0fff0" stroke="#90c090" stroke-width="1.5"/>

  <!-- Region labels -->
  <text x="145" y="78" text-anchor="middle" font-size="11" fill="#6080a0" font-weight="600">OPEN — passive</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#a08060" font-weight="600">OPEN — active</text>
  <text x="695" y="78" text-anchor="middle" font-size="11" fill="#608060" font-weight="600">CLOSED</text>

  <!-- State boxes -->
  <rect x="75" y="110" width="120" height="40" rx="8" fill="white" stroke="#7090b0" stroke-width="1.5"/>
  <text x="135" y="135" text-anchor="middle" font-weight="500">Proposed</text>

  <rect x="75" y="250" width="120" height="40" rx="8" fill="white" stroke="#7090b0" stroke-width="1.5"/>
  <text x="135" y="275" text-anchor="middle" font-weight="500">Planned</text>

  <rect x="360" y="110" width="130" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="425" y="135" text-anchor="middle" font-weight="500">In Progress</text>

  <rect x="360" y="200" width="130" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="425" y="225" text-anchor="middle" font-weight="500">Paused</text>

  <rect x="330" y="290" width="190" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="425" y="315" text-anchor="middle" font-weight="500">Awaiting Decision</text>

  <rect x="635" y="110" width="120" height="40" rx="8" fill="white" stroke="#70a070" stroke-width="1.5"/>
  <text x="695" y="135" text-anchor="middle" font-weight="500">Done</text>

  <rect x="635" y="250" width="120" height="40" rx="8" fill="white" stroke="#70a070" stroke-width="1.5"/>
  <text x="695" y="275" text-anchor="middle" font-weight="500">Rejected</text>

  <!-- Proposed → Planned -->
  <line x1="135" y1="150" x2="135" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Planned → In Progress -->
  <path d="M 195 260 L 358 138" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- In Progress → Done -->
  <line x1="490" y1="130" x2="633" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- In Progress → Paused (left side, going down) -->
  <line x1="405" y1="150" x2="405" y2="198" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Paused → In Progress (right side, going up) -->
  <line x1="445" y1="200" x2="445" y2="152" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- In Progress → Awaiting Decision (left side, going down) -->
  <line x1="380" y1="150" x2="380" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Awaiting Decision → In Progress (right side, going up) -->
  <line x1="470" y1="290" x2="470" y2="152" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Awaiting Decision → Paused -->
  <path d="M 500 295 Q 530 255 492 238" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Any open → Rejected (dashed) -->
  <path d="M 570 340 L 640 282" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-light)"/>
  <text x="555" y="358" font-size="10" fill="#999" font-style="italic">any open state</text>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#333">Issue Lifecycle</text>
</svg>
