<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <!-- Background regions -->
  <rect x="20" y="50" width="280" height="280" rx="12" fill="#f0f4ff" stroke="#b0c4de" stroke-width="1.5"/>
  <rect x="320" y="50" width="220" height="280" rx="12" fill="#fff8f0" stroke="#deb887" stroke-width="1.5"/>
  <rect x="560" y="50" width="220" height="280" rx="12" fill="#f0fff0" stroke="#90c090" stroke-width="1.5"/>

  <!-- Region labels -->
  <text x="160" y="78" text-anchor="middle" font-size="11" fill="#6080a0" font-weight="600">OPEN — passive</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#a08060" font-weight="600">OPEN — active</text>
  <text x="670" y="78" text-anchor="middle" font-size="11" fill="#608060" font-weight="600">CLOSED</text>

  <!-- State boxes -->
  <!-- Proposed -->
  <rect x="60" y="120" width="120" height="40" rx="8" fill="white" stroke="#7090b0" stroke-width="1.5"/>
  <text x="120" y="145" text-anchor="middle" font-weight="500">Proposed</text>

  <!-- Planned -->
  <rect x="60" y="230" width="120" height="40" rx="8" fill="white" stroke="#7090b0" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" font-weight="500">Planned</text>

  <!-- In Progress -->
  <rect x="370" y="120" width="120" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="430" y="145" text-anchor="middle" font-weight="500">In Progress</text>

  <!-- Paused -->
  <rect x="370" y="200" width="120" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="430" y="225" text-anchor="middle" font-weight="500">Paused</text>

  <!-- Awaiting Decision -->
  <rect x="345" y="275" width="170" height="40" rx="8" fill="white" stroke="#c09050" stroke-width="1.5"/>
  <text x="430" y="300" text-anchor="middle" font-weight="500">Awaiting Decision</text>

  <!-- Done -->
  <rect x="610" y="120" width="120" height="40" rx="8" fill="white" stroke="#70a070" stroke-width="1.5"/>
  <text x="670" y="145" text-anchor="middle" font-weight="500">Done</text>

  <!-- Rejected -->
  <rect x="610" y="230" width="120" height="40" rx="8" fill="white" stroke="#70a070" stroke-width="1.5"/>
  <text x="670" y="255" text-anchor="middle" font-weight="500">Rejected</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Proposed → Planned -->
  <line x1="120" y1="160" x2="120" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Planned → In Progress -->
  <line x1="180" y1="250" x2="365" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- In Progress → Done -->
  <line x1="490" y1="140" x2="605" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- In Progress → Paused -->
  <line x1="415" y1="160" x2="415" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Paused → In Progress -->
  <line x1="445" y1="200" x2="445" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- In Progress → Awaiting Decision -->
  <line x1="400" y1="160" x2="400" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Awaiting Decision → In Progress -->
  <line x1="460" y1="275" x2="460" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Awaiting Decision → Paused -->
  <path d="M 500 285 Q 520 250 490 240" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Any open → Rejected (dashed) -->
  <path d="M 540 330 L 615 262" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="540" y="355" font-size="10" fill="#999" font-style="italic">any open state</text>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#333">Issue Lifecycle</text>
</svg>
